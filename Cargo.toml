[package]
name = "zammad-tui"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "zui"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
crossterm = { version = "0.28", features = ["event-stream"] }
futures = "0.3"
dirs = "5"
html2text = "0.12"
image = "0.25"
ratatui = "0.29"
reqwest = { version = "0.13", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
toml = "0.8"
